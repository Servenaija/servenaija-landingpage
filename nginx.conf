server {
    listen 80;
    # No server_name or SSL needed here! The Master Proxy handles that.

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Keep your React Router support - This is the most important part!
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep your Cache settings for performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Keep your Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
}